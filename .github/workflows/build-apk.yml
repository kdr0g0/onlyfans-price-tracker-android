
name: Build Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unpack app source
        run: unzip -o onlyfans-price-tracker-android-mvp-0.1.0.zip -d appsrc

      - name: Install dependencies
        working-directory: appsrc
        run: npm install

      - name: Build web app
        working-directory: appsrc
        run: npm run build

      - name: Generate Android project
        working-directory: appsrc
        run: npx cap add android

      - name: Build APK
        working-directory: appsrc/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: onlyfans-price-tracker-debug-apk
          path: appsrc/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
